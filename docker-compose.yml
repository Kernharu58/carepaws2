version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./lykasServer
      target: build
    command: npm run dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/carepaws
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_only_jwt_secret_change_me_32chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev_only_refresh_secret_change_me_32c
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:5173
      MOBILE_APP_URL: carepaws://
      LOG_LEVEL: debug
    volumes:
      - ./lykasServer/src:/app/src
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ./lykasAdmin
      target: build
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./lykasAdmin/src:/app/src
    depends_on:
      - server

# lykasUser (the mobile app) is intentionally NOT a compose service —
# Expo/EAS builds natively and doesn't containerize (§11.4). Run it
# separately with `cd lykasUser && npx expo start`, pointing
# EXPO_PUBLIC_API_URL at whichever backend you're running (this compose
# stack's http://localhost:5000 works for a simulator; a physical
# device needs your machine's LAN IP instead of localhost).

volumes:
  mongo_data:
  redis_data:
