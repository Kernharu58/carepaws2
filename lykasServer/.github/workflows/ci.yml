name: lykasServer CI

on:
  pull_request:
    paths:
      - "lykasServer/**"
  push:
    branches: [main, develop, staging]
    paths:
      - "lykasServer/**"

defaults:
  run:
    working-directory: lykasServer

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: lykasServer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Audit dependencies (fail on new high/critical)
        run: npm audit --audit-level=high

  build-image:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t carepaws-server:${{ github.sha }} ./lykasServer
