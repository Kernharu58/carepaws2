name: lykasUser CI

on:
  pull_request:
    paths:
      - "lykasUser/**"
  push:
    branches: [main, develop, staging]
    paths:
      - "lykasUser/**"

defaults:
  run:
    working-directory: lykasUser

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: lykasUser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - name: Audit dependencies (fail on new high/critical)
        run: npm audit --audit-level=high

  eas-staging-build:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: lykasUser/package-lock.json

      - name: Install dependencies
        working-directory: lykasUser
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build staging profile (no native install/run — catches config & bundling errors)
        working-directory: lykasUser
        run: eas build --platform all --profile staging --non-interactive --no-wait
